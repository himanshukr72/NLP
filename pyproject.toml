[project]
name = "nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "himanshukr72", email = "himanshukr72830@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "emoji>=2.15.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyspellchecker>=0.9.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "spellchecker>=0.4",
    "tqdm>=4.70.0",
]

[project.scripts]
nlp = "nlp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
